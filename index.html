<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rolling Sky UGC Assets</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%230d1117'/><path d='M4 10.5 6.5 8l2 2 3-3.5V12H4z' fill='%2358a6ff'/></svg>">
<style>
  @font-face {
    font-family: 'Sen';
    src: url('font/sen-regular.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Sen';
    src: url('font/sen-bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0d1117;
    --bg-card: #161b22;
    --bg-hover: #1c2128;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Sen', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 48px 24px;
  }

  /* ===== Header ===== */
  .header {
    text-align: center;
    margin-bottom: 36px;
  }

  .header h1 {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }

  .header .sub {
    font-size: 14px;
    color: var(--text-dim);
  }

  .header .sub a {
    color: var(--accent);
    text-decoration: none;
  }

  /* ===== Announcement ===== */
  .announcement {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--green);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 32px;
    font-size: 14px;
    line-height: 1.7;
  }

  .announcement-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--green);
    margin-bottom: 8px;
  }

  .announcement-body {
    white-space: pre-line;
    color: var(--text);
  }

  /* ===== Image Card ===== */
  .image-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 24px;
  }

  .image-preview {
    background:
      linear-gradient(45deg, #1a1f27 25%, transparent 25%),
      linear-gradient(-45deg, #1a1f27 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #1a1f27 75%),
      linear-gradient(-45deg, transparent 75%, #1a1f27 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .image-preview img {
    max-width: 100%;
    max-height: 400px;
    object-fit: contain;
    display: block;
  }

  .image-info {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .image-name {
    font-size: 14px;
    font-weight: 700;
  }

  .image-size {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  /* ===== Download Button ===== */
  .btn-download {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 14px;
    background: #1f6feb;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-family: 'Sen', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
    text-decoration: none;
  }

  .btn-download:hover {
    background: #388bfd;
  }

  .btn-download:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .btn-download:disabled:hover {
    background: #1f6feb;
  }

  /* ===== Secondary Button ===== */
  .btn-secondary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Sen', sans-serif;
    font-size: 14px;
    font-weight: 400;
    cursor: pointer;
    transition: all 0.15s ease;
    text-decoration: none;
  }

  .btn-secondary:hover {
    background: var(--bg-card);
    border-color: var(--text-dim);
  }

  .btn-secondary svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
  }

  /* ===== Tutorial Modal ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .modal-overlay.active {
    display: flex;
  }

  .modal {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 600px;
    max-width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 28px;
    position: relative;
  }

  .modal-close {
    position: absolute;
    top: 16px;
    right: 18px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 24px;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }

  .modal-close:hover {
    color: var(--text);
  }

  .modal h2 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 16px;
  }

  .modal-step {
    margin-bottom: 20px;
  }

  .modal-step-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    margin-bottom: 6px;
  }

  .modal-step p {
    font-size: 14px;
    color: var(--text);
    line-height: 1.6;
    margin-bottom: 10px;
  }

  .modal-step a {
    color: var(--accent);
    text-decoration: none;
  }

  .modal-step a:hover {
    text-decoration: underline;
  }

  .modal img {
    width: 100%;
    border-radius: 8px;
    border: 1px solid var(--border);
    display: block;
  }

  .btn-download svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

  /* ===== Footer ===== */
  .footer {
    margin-top: 40px;
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
  }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>Rolling Sky UGC</h1>
    <div class="sub">
      <a href="https://github.com/QAQA114514/rolling-sky-ugc-web-mod-assets" target="_blank" rel="noopener">rolling-sky-ugc-web-mod-assets</a>
    </div>
  </div>

  <!-- Announcement -->
  <div class="announcement" id="announcement" style="display:none">
    <div class="announcement-label">Announcement</div>
    <div class="announcement-body" id="announcementBody"></div>
  </div>

  <!-- Image -->
  <div class="image-card">
    <div class="image-preview">
      <img src="https://raw.githubusercontent.com/QAQA114514/rolling-sky-ugc-web-mod-assets/main/QAQA-UGC-tileset.png"
           alt="QAQA-UGC-tileset.png">
    </div>
    <div class="image-info">
      <div>
        <div class="image-name">QAQA-UGC-tileset.png</div>
        <div class="image-size" id="fileSize">Loading...</div>
      </div>
    </div>
  </div>

  <!-- Download -->
  <button class="btn-download" id="btnDownload">
    <svg viewBox="0 0 16 16">
      <path d="M8 2a.75.75 0 0 1 .75.75v5.69l2.22-2.22a.75.75 0 1 1 1.06 1.06l-3.5 3.5a.75.75 0 0 1-1.06 0l-3.5-3.5a.75.75 0 1 1 1.06-1.06l2.22 2.22V2.75A.75.75 0 0 1 8 2Z"/>
      <path d="M2.75 12a.75.75 0 0 1 .75.75v1.5h9v-1.5a.75.75 0 0 1 1.5 0v2.25a.75.75 0 0 1-.75.75h-10.5A.75.75 0 0 1 2 15v-2.25a.75.75 0 0 1 .75-.75Z"/>
    </svg>
    <span id="btnText">Download</span>
  </button>

  <!-- Open Editor -->
  <a class="btn-secondary" href="https://sqdldev.github.io/rolling-sky/tileset/" target="_blank" rel="noopener">
    <svg viewBox="0 0 16 16">
      <path d="M3.75 2h3.5a.75.75 0 0 1 0 1.5h-3.5a.25.25 0 0 0-.25.25v8.5c0 .138.112.25.25.25h8.5a.25.25 0 0 0 .25-.25v-3.5a.75.75 0 0 1 1.5 0v3.5A1.75 1.75 0 0 1 12.25 14h-8.5A1.75 1.75 0 0 1 2 12.25v-8.5C2 2.784 2.784 2 3.75 2Zm6.5.75a.75.75 0 0 1 .75-.75h3a.75.75 0 0 1 .75.75v3a.75.75 0 0 1-1.5 0V3.56L8.28 8.28a.75.75 0 0 1-1.06-1.06L12.94 2.5H11a.75.75 0 0 1-.75-.75Z"/>
    </svg>
    jump into sqdl download web
  </a>

  <!-- Tutorial -->
  <button class="btn-secondary" id="btnTutorial">
    <svg viewBox="0 0 16 16">
      <path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0Zm0 2a6 6 0 1 0 0 12A6 6 0 0 0 8 2Zm0 2a1 1 0 0 1 1 1v3h2a1 1 0 1 1 0 2H8a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Zm-1 8a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0Z"/>
    </svg>
    Tutorial
  </button>

  <div class="footer">
    Assets served via GitHub
  </div>

</div>

<!-- Tutorial Modal -->
<div class="modal-overlay" id="tutorialModal">
  <div class="modal">
    <button class="modal-close" onclick="closeTutorial()">&times;</button>
    <h2>Tutorial</h2>

    <div class="modal-step">
      <div class="modal-step-label">Step 1</div>
      <p>Download and install <a href="https://www.mapeditor.org/" target="_blank" rel="noopener">Tiled</a> map editor first.</p>
    </div>

    <div class="modal-step">
      <div class="modal-step-label">Step 2</div>
      <p>Import the tileset image into Tiled as shown below:</p>
      <img src="assets/1.png" alt="Tiled tileset import tutorial">
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  var ANNOUNCEMENT_URL = 'https://raw.githubusercontent.com/QAQA114514/annoucement/main/base.txt';
  var FILE_URL = 'https://raw.githubusercontent.com/QAQA114514/rolling-sky-ugc-web-mod-assets/main/QAQA-UGC-tileset.png';

  // Load announcement
  fetch(ANNOUNCEMENT_URL)
    .then(function(res) { return res.text(); })
    .then(function(text) {
      text = text.trim();
      if (text) {
        document.getElementById('announcementBody').textContent = text;
        document.getElementById('announcement').style.display = 'block';
      }
    })
    .catch(function(err) { console.warn('Announcement load failed:', err); });

  // Get file size
  fetch(FILE_URL, { method: 'HEAD' })
    .then(function(res) {
      var size = parseInt(res.headers.get('content-length') || '0');
      if (size > 0) {
        var k = 1024;
        var sizes = ['B', 'KB', 'MB', 'GB'];
        var i = Math.floor(Math.log(size) / Math.log(k));
        document.getElementById('fileSize').textContent =
          parseFloat((size / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
      }
    })
    .catch(function() {
      document.getElementById('fileSize').textContent = '';
    });

  // Download via blob (cross-origin safe)
  var btn = document.getElementById('btnDownload');
  var btnText = document.getElementById('btnText');
  btn.addEventListener('click', function() {
    btn.disabled = true;
    btnText.textContent = 'Downloading...';
    fetch(FILE_URL)
      .then(function(res) { return res.blob(); })
      .then(function(blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'QAQA-UGC-tileset.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
        btnText.textContent = 'Downloaded';
        setTimeout(function() {
          btn.disabled = false;
          btnText.textContent = 'Download';
        }, 2000);
      })
      .catch(function(err) {
        console.error('Download failed:', err);
        btnText.textContent = 'Failed - retry';
        btn.disabled = false;
        setTimeout(function() { btnText.textContent = 'Download'; }, 2000);
      });
  });

  // Tutorial modal
  var tutorialModal = document.getElementById('tutorialModal');
  document.getElementById('btnTutorial').addEventListener('click', function() {
    tutorialModal.classList.add('active');
  });
  window.closeTutorial = function() {
    tutorialModal.classList.remove('active');
  };
  tutorialModal.addEventListener('click', function(e) {
    if (e.target === tutorialModal) closeTutorial();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeTutorial();
  });

})();
</script>

</body>
</html>
